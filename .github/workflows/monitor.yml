name: Revisar JW y publicar panel

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: ["main"]
    paths:
      - "scan.py"
      - "notify.py"
      - "test*.py"
      - "site/index.html"
      - ".github/workflows/monitor.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor-jw
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar pruebas
        run: python -m unittest -v

      - name: Revisar fuentes
        run: python scan.py

      - name: Enviar novedades por correo
        id: email
        continue-on-error: true
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: emilio.antunez.88@gmail.com,laotracaradelatorre@gmail.com
        run: python notify.py

      - name: Guardar historial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar historial del monitor"
            git push
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar página
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Informar fallo de correo
        if: steps.email.outcome == 'failure'
        run: |
          echo "Falló el correo. Las novedades siguen pendientes; revisar SMTP_USERNAME y SMTP_PASSWORD."
          exit 1
